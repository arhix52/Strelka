[package]
name = "wow2strelka"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Convert World of Warcraft locations into normalized Strelka scenes"
license = "MIT"

[dependencies]
anyhow = "1.0"
byteorder = "1.5"
casc-lib = "0.2.1"
clap = { version = "4.5", features = ["derive"] }
csv = "1.4"
glam = { version = "0.31", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wow-adt = "0.7.0"
wow-blp = "0.7.0"
wow-m2 = "0.7.0"
wow-wmo = "0.7.0"

[dev-dependencies]
tempfile = "3.20"
