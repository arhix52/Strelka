name: macOS

on:
  push:
    branches: [main, arhix/wavefront]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-smoke:
    # macOS 26, not 14: the renderer is Metal 4 only, and MetalFxContext.mm names
    # MTL4FXSpatialScaler / MTL4FXTemporalScaler, which no earlier SDK declares.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install tools
        run: |
          brew install ninja
          # The runner's python3 is Homebrew's, which refuses to install into
          # itself (PEP 668) -- including with --user, since that flag does not
          # opt out of the check. A virtual environment is the supported way in,
          # and putting its bin on PATH keeps `conan` spelled the same
          # everywhere, including inside build.sh.
          python3 -m venv "$HOME/conan-venv"
          "$HOME/conan-venv/bin/python" -m pip install --upgrade pip
          # numpy is for the smoke check below, which reads the rendered EXR back.
          "$HOME/conan-venv/bin/python" -m pip install "conan>=2,<3" numpy
          echo "$HOME/conan-venv/bin" >> "$GITHUB_PATH"
          "$HOME/conan-venv/bin/conan" --version

      - name: Metal toolchain
        run: |
          xcrun -sdk macosx --find metal
          xcrun -sdk macosx --find metallib
          xcodebuild -version

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-macos-${{ hashFiles('conanfile.py', 'scripts/export_local_conan.sh') }}

      - name: Conan profile
        run: |
          conan profile detect --force
          conan --version

      - name: Build Release
        run: ./build.sh Release

      - name: Verify metallibs
        working-directory: build/Release
        run: |
          for lib in wavefront tonemapper skinning; do
            test -s "metal/shaders/${lib}.metallib"
          done

      - name: Unit tests
        working-directory: build/Release
        run: ./unit_tests

      # GitHub-hosted macOS has no GPU passthrough. StrelkaCLI used to SIGSEGV
      # (exit 139) there after CreateSystemDefaultDevice returned nil; it now
      # exits 3. Treat that as a skip so the compile + unit-test gate stays green.
      # A self-hosted runner with a real GPU still runs the smokes.
      - name: Probe Metal GPU
        run: |
          cat > /tmp/probe_metal.swift <<'EOF'
          import Metal
          let devices = MTLCopyAllDevices()
          print("MTLCopyAllDevices count=\(devices.count)")
          for d in devices {
              print("device name=\(d.name) raytracing=\(d.supportsRaytracing)")
          }
          if let def = MTLCreateSystemDefaultDevice() {
              print("default name=\(def.name) raytracing=\(def.supportsRaytracing)")
          } else {
              print("default=nil")
          }
          EOF
          swift /tmp/probe_metal.swift || echo "::warning::Metal probe failed to run"

      - name: CLI smoke (no golden images)
        working-directory: build/Release
        run: |
          # Exposure is stated rather than defaulted, and the output is an EXR
          # that gets read back. The old form rendered at the default
          # ISO 100 / f4 / 1/100s through the ACES curve, which underflows this
          # scene to exactly zero in 8-bit, and then asserted only that the file
          # was non-empty -- so it passed on an entirely black image, and would
          # have gone on passing if the renderer stopped tracing altogether.
          set +e
          ./StrelkaCLI ../../scenes/validation/cornell_box/cornell_box.glb \
            -o /tmp/strelka_smoke.exr -w 64 --height 48 --spp 16 \
            --tonemap none --exposure-iso 100
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "::notice::No Metal GPU on this runner; skipping Cornell smoke"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          test -s /tmp/strelka_smoke.exr
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "../../tools/feature_tests")
          from exr_io import load_exr
          a = load_exr("/tmp/strelka_smoke.exr")
          lit = 100.0 * (a.sum(-1) > 1e-6).mean()
          print("smoke: mean %.5f  max %.4f  lit %.1f%%" % (a.mean(), a.max(), lit))
          if a.mean() <= 1e-4:
              sys.exit("the cornell box came out black")
          PY

      - name: Skinning smoke (BrainStem mid-pose)
        working-directory: build/Release
        run: |
          # animation_time=0.5 is load-bearing: at t=start the skeleton is never
          # dirtied and this would pass with skinning broken.
          set +e
          ./StrelkaCLI -c ../../scenes/validation/brainstem/BrainStem.toml \
            -o /tmp/strelka_brainstem.png -w 128 --height 96 --spp 8 2>&1 | tee /tmp/strelka_brainstem.log
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "::notice::No Metal GPU on this runner; skipping BrainStem smoke"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          test -s /tmp/strelka_brainstem.png
          # Extent is the diagonal of the skinned vertices on the GPU. A broken
          # skinning submission collapses it toward zero; BrainStem mid-pose is
          # a few units tall.
          grep -E 'Skinned geometry extent: [1-9]' /tmp/strelka_brainstem.log
